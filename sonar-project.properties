sonar.projectName=Dutch
sonar.sourceEncoding=UTF-8

# Monorepo Flutter + Node.js
sonar.sources=lib,tool,dutch-server/src,.github/workflows
sonar.tests=test,integration_test,dutch-server/src/__tests__

# Les tests backend vivent sous src/__tests__, on les exclut donc des sources.
sonar.exclusions=dutch-server/src/__tests__/**,dutch-server/node_modules/**,dutch-server/dist/**,build/**,.dart_tool/**,coverage/**
sonar.test.inclusions=test/**,integration_test/**,dutch-server/src/__tests__/**

# Couverture Flutter (générée par `flutter test --coverage`)
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Couverture backend TypeScript (générée par `npm run test:coverage`)
sonar.javascript.lcov.reportPaths=dutch-server/coverage/lcov.info
