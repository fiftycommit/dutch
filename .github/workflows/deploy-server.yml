name: Deploy to Production

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Flutter web
        run: |
          flutter build web --release --base-href / --tree-shake-icons --no-web-resources-cdn \
            --dart-define=FCM_WEB_VAPID_KEY="$FCM_WEB_VAPID_KEY" \
            --dart-define=FIREBASE_APP_CHECK_WEB_SITE_KEY="$FIREBASE_APP_CHECK_WEB_SITE_KEY"
          node scripts/generate-pwa-service-worker.mjs build/web
          cp build/web/index.html build/web/404.html
        env:
          FCM_WEB_VAPID_KEY: ${{ secrets.FCM_WEB_VAPID_KEY }}
          FIREBASE_APP_CHECK_WEB_SITE_KEY: ${{ secrets.FIREBASE_APP_CHECK_WEB_SITE_KEY }}

      - name: Configure SSH for getFilms
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' '88.96.63.215 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEwbhjISAMz1GpAzI5vWKM3QBc6XGYoQNizeH9bzyNeT' > ~/.ssh/known_hosts

      - name: Upload and build backend release
        run: |
          set -euo pipefail
          release="/srv/dutch/releases/$GITHUB_SHA"
          ssh max@88.96.63.215 "mkdir -p '$release' /srv/dutch/shared/data"
          rsync -az --exclude=data --exclude=node_modules --exclude=dist --exclude=coverage \
            dutch-server/ "max@88.96.63.215:$release/"
          ssh max@88.96.63.215 "cd '$release' && npm ci --no-audit --no-fund && npm run build && npm prune --omit=dev && ln -sfn /srv/dutch/shared/data data"

      - name: Install secrets and start backend
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | ssh max@88.96.63.215 \
            'umask 077; cat > /srv/dutch/shared/data/firebase-service-account.json'
          {
            printf 'FIREBASE_WEB_API_KEY=%s\n' "$FIREBASE_WEB_API_KEY"
            printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL"
            printf 'ADMIN_SECRET=%s\n' "$ADMIN_SECRET"
          } | ssh max@88.96.63.215 'umask 077; cat > /srv/dutch/shared/dutch.env'
          ssh max@88.96.63.215 "ln -sfn /srv/dutch/releases/$GITHUB_SHA /srv/dutch/current && sudo systemctl restart dutch-server && sleep 3 && curl -fsS http://127.0.0.1:3001/health"

      - name: Upload frontend
        run: |
          rsync -az --delete build/web/ max@88.96.63.215:/srv/dutch/web/
          ssh max@88.96.63.215 'sudo nginx -t && sudo systemctl reload nginx'
