name: Deploy to Production Server

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          flutter build web --release --base-href /
          cp build/web/index.html build/web/404.html

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build
          path: './build/web'
          retention-days: 1

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: flutter-build
          path: './build/web'

      - name: Deploy frontend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: dutch-game.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/web/*"
          target: "/var/www/dutch/"
          strip_components: 1
          overwrite: true
          rm: true

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy server code
        uses: appleboy/scp-action@v0.1.7
        with:
          host: dutch-game.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dutch-server/*"
          target: "/var/www/"
          strip_components: 0

      - name: Install and restart server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: dutch-game.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /var/www/dutch-server
            cd /var/www/dutch-server
            npm install --production
            npm run build
            
            # Create ML data directories
            echo "Creating ML data directories..."
            mkdir -p data/bot-learning/{games,profiles,qlearning,neural,clones,personalities,tournaments,genetic,adaptive,leaderboard}
            mkdir -p data/player-learning/{profiles,history}
            chmod -R 755 data/
            
            # Update Nginx config if needed
            if ! grep -q "location /bot-stats" /etc/nginx/sites-available/dutch-server; then
              echo "Updating Nginx configuration for ML dashboard..."
              sed -i '/location \/health {/i\    location /bot-stats {\n        proxy_pass http://dutch_backend/bot-stats;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n\n    location /player-profile {\n        proxy_pass http://dutch_backend/player-profile;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n\n    location /api/bot-learning {\n        proxy_pass http://dutch_backend/api/bot-learning;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n\n    location /api/player-learning {\n        proxy_pass http://dutch_backend/api/player-learning;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n' /etc/nginx/sites-available/dutch-server
              nginx -t && systemctl reload nginx
            fi

            # Ensure player profile dashboard is routed to backend even if /bot-stats already exists
            if ! grep -q "location /player-profile" /etc/nginx/sites-available/dutch-server; then
              echo "Updating Nginx configuration for player profile dashboard..."
              sed -i '/location \/health {/i\    location /player-profile {\n        proxy_pass http://dutch_backend/player-profile;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n' /etc/nginx/sites-available/dutch-server
              nginx -t && systemctl reload nginx
            fi

            # Ensure player learning API is routed to backend
            if ! grep -q "location /api/player-learning" /etc/nginx/sites-available/dutch-server; then
              echo "Updating Nginx configuration for player learning API..."
              sed -i '/location \/health {/i\    location /api/player-learning {\n        proxy_pass http://dutch_backend/api/player-learning;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n' /etc/nginx/sites-available/dutch-server
              nginx -t && systemctl reload nginx
            fi

            # Ensure /version is routed to backend (otherwise Flutter SPA catches it)
            if ! grep -q "location /version" /etc/nginx/sites-available/dutch-server; then
              echo "Updating Nginx configuration for /version endpoint..."
              sed -i '/location \/health {/i\    location /version {\n        proxy_pass http://dutch_backend/version;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n' /etc/nginx/sites-available/dutch-server
              nginx -t && systemctl reload nginx
            fi
            
            if ! grep -q "location /status" /etc/nginx/sites-available/dutch-server; then
              echo "Updating Nginx configuration..."
              sed -i '/location \/health {/i\    location /status {\n        proxy_pass http://dutch_backend/status;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n\n    location /rooms {\n        proxy_pass http://dutch_backend/rooms;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n' /etc/nginx/sites-available/dutch-server
              nginx -t && systemctl reload nginx
            fi
            
            export GIT_SHA="${{ github.sha }}"
            export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            pm2 restart dutch-server --update-env || pm2 start dist/index.js --name dutch-server --update-env
            echo "✅ Backend deployed successfully!"
            echo "🤖 ML Dashboard: https://dutch-game.me/bot-stats"
