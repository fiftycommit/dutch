name: Deploy to Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Prevent concurrent deploys
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── 1. Build Flutter Web ──────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Web
        run: |
          flutter build web \
            --release \
            --base-href / \
            --tree-shake-icons \
            ${FCM_WEB_VAPID_KEY:+--dart-define=FCM_WEB_VAPID_KEY="$FCM_WEB_VAPID_KEY"}
          cp build/web/index.html build/web/404.html
        env:
          FCM_WEB_VAPID_KEY: ${{ secrets.FCM_WEB_VAPID_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: build/web
          retention-days: 1

  # ── 2. Deploy Frontend ────────────────────────────────────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flutter-web
          path: build/web

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: dutch-game.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/web/*"
          target: "/var/www/dutch/"
          strip_components: 1
          overwrite: true
          rm: true

  # ── 3. Deploy Backend ─────────────────────────────────────────────────
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Clean old source before upload (scp doesn't delete removed files)
      - name: Clean server source
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: dutch-game.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf /root/apps/dutch-server/src /root/apps/dutch-server/dist

      # Upload server code
      - name: Deploy server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: dutch-game.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dutch-server/*"
          target: "/root/apps/dutch-server"
          strip_components: 1

      # Install, build, restart
      - name: Install and restart services
        uses: appleboy/ssh-action@v1.0.3
        env:
          GIT_SHA: ${{ github.sha }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        with:
          host: dutch-game.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GIT_SHA,FIREBASE_SERVICE_ACCOUNT_JSON,ADMIN_SECRET
          command_timeout: 10m
          script: |
            set -e

            # ── Nginx Config ──
            cp /root/apps/dutch-server/nginx/dutch-server.conf /etc/nginx/sites-available/dutch-server
            ln -sf /etc/nginx/sites-available/dutch-server /etc/nginx/sites-enabled/
            nginx -t && systemctl reload nginx || echo "⚠️ Nginx reload failed, check config"

            # ── Kill any rogue process on port 3000 ──
            fuser -k 3000/tcp 2>/dev/null || true
            sleep 1

            # ── Backend ──
            echo "🔨 Building backend..."
            cd /root/apps/dutch-server
            # Install ALL deps (including devDeps needed for tsc)
            npm install 2>&1 || true
            npm run build || { echo "❌ Build failed"; exit 1; }
            # Remove devDeps after build
            npm prune --production 2>&1 || true

            # ML data dirs
            mkdir -p data/bot-learning/{games,profiles,qlearning,neural,clones,personalities,tournaments,genetic,adaptive,leaderboard}
            mkdir -p data/player-learning/{profiles,history}
            chmod -R 755 data/

            # ── PM2 restart ──
            BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            # Write Firebase creds to file (avoids shell escaping issues with JSON)
            echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /root/apps/dutch-server/data/firebase-service-account.json
            chmod 600 /root/apps/dutch-server/data/firebase-service-account.json

            cat > ecosystem.config.cjs << 'PMCFG'
            const fs = require('fs');
            let firebaseCreds = '';
            try {
              firebaseCreds = fs.readFileSync('/root/apps/dutch-server/data/firebase-service-account.json', 'utf-8').trim();
            } catch(e) {}
            module.exports = {
              apps: [{
                name: 'dutch-server',
                cwd: '/root/apps/dutch-server',
                script: 'dist/index.js',
                instances: 1,
                exec_mode: 'fork',
                env: {
                  NODE_ENV: 'production',
                  PORT: 3000,
                  GIT_SHA: process.env.GIT_SHA || '',
                  BUILD_TIME: process.env.BUILD_TIME || '',
                  FIREBASE_SERVICE_ACCOUNT_JSON: firebaseCreds,
                  ADMIN_SECRET: process.env.ADMIN_SECRET || '',
                },
                max_memory_restart: '700M',
              }],
            };
            PMCFG
            # Inject shell vars that the quoted heredoc can't expand
            export BUILD_TIME
            export GIT_SHA
            export ADMIN_SECRET

            pm2 delete dutch-server 2>/dev/null || true
            pm2 start ecosystem.config.cjs
            pm2 save

            # Quick health check (wait longer for initialization)
            sleep 8
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "✅ Backend is healthy!"
            else
              echo "❌ Backend health check failed!"
              pm2 logs dutch-server --lines 20 --nostream
              exit 1
            fi

            echo "✅ Deploy complete"
