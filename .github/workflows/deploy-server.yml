name: Deploy to Production Server

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web
        run: |
          flutter build web --release --base-href /
          cp build/web/index.html build/web/404.html

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build
          path: './build/web'
          retention-days: 1

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: flutter-build
          path: './build/web'

      - name: Deploy frontend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: dutch-game.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/web/*"
          target: "/var/www/dutch/web/"
          strip_components: 1

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy server code
        uses: appleboy/scp-action@v0.1.7
        with:
          host: dutch-game.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dutch-server/*"
          target: "/root/apps/"
          strip_components: 0

      - name: Install and restart server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: dutch-game.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/apps/dutch-server
            npm install --production
            npm run build
            pm2 restart dutch-server || pm2 start dist/index.js --name dutch-server
            systemctl restart nginx
            echo "✅ Backend deployed successfully!"
