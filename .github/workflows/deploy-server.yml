name: Deploy to Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Prevent concurrent deploys
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── 1. Build Flutter Web ──────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Web
        run: |
          flutter build web \
            --release \
            --base-href / \
            --no-tree-shake-icons \
            ${FCM_WEB_VAPID_KEY:+--dart-define=FCM_WEB_VAPID_KEY="$FCM_WEB_VAPID_KEY"}
          cp build/web/index.html build/web/404.html
        env:
          FCM_WEB_VAPID_KEY: ${{ secrets.FCM_WEB_VAPID_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: build/web
          retention-days: 1

  # ── 2. Deploy Frontend ────────────────────────────────────────────────
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flutter-web
          path: build/web

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: dutch-game.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/web/*"
          target: "/var/www/dutch/"
          strip_components: 1
          overwrite: true
          rm: true

  # ── 3. Deploy Backend + Trainer ───────────────────────────────────────
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Upload trainer code
      - name: Deploy trainer
        uses: appleboy/scp-action@v0.1.7
        with:
          host: dutch-game.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "tool/bot_training_runner.dart,lib/**,pubspec.yaml,pubspec.lock,analysis_options.yaml,assets/**"
          target: "/var/www/dutch-trainer"
          strip_components: 0
          overwrite: true

      # Clean old source before upload (scp doesn't delete removed files)
      - name: Clean server source
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: dutch-game.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -rf /root/apps/dutch-server/src /root/apps/dutch-server/dist

      # Upload server code
      - name: Deploy server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: dutch-game.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dutch-server/*"
          target: "/root/apps/dutch-server"
          strip_components: 1


      # Install, build, restart
      - name: Install and restart services
        uses: appleboy/ssh-action@v1.0.3
        env:
          GIT_SHA: ${{ github.sha }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        with:
          host: dutch-game.me
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GIT_SHA,FIREBASE_SERVICE_ACCOUNT_JSON
          command_timeout: 10m
          script: |
            set -e

            # ── Nginx Config ──
            cp /root/apps/dutch-server/nginx/dutch-server.conf /etc/nginx/sites-available/dutch-server
            ln -sf /etc/nginx/sites-available/dutch-server /etc/nginx/sites-enabled/
            nginx -t && systemctl reload nginx || echo "⚠️ Nginx reload failed, check config"

            # ── Trainer ──
            if [ ! -d /home/dutch/flutter ]; then
              echo "📥 Installing Flutter..."
              git clone https://github.com/flutter/flutter.git -b stable /home/dutch/flutter
              chown -R dutch:dutch /home/dutch/flutter
              /home/dutch/flutter/bin/flutter --version
              /home/dutch/flutter/bin/flutter config --no-analytics
            fi

            mkdir -p /var/www/dutch-trainer
            chown -R dutch:dutch /var/www/dutch-trainer || true
            cd /var/www/dutch-trainer
            /home/dutch/flutter/bin/flutter pub get || echo "⚠️ flutter pub get failed, continuing"

            # Swap for low-memory VMs
            if ! swapon --show | grep -q '/swapfile'; then
              [ ! -f /swapfile ] && fallocate -l 2G /swapfile
              chmod 600 /swapfile
              mkswap -f /swapfile
              swapon /swapfile
              grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
            fi

            cat > /etc/systemd/system/dutch-bot-trainer.service << 'SERVICE'
            [Unit]
            Description=Dutch Bot Trainer
            After=network.target
            StartLimitIntervalSec=600
            StartLimitBurst=3

            [Service]
            Type=simple
            User=dutch
            WorkingDirectory=/var/www/dutch-trainer
            Environment=HOME=/home/dutch
            Environment=BOT_TRAIN_SERVER=https://dutch-game.me
            Environment=BOT_TRAIN_START_HOUR=20
            Environment=BOT_TRAIN_END_HOUR=12
            Environment=BOT_TRAIN_BATCH=4
            Environment=BOT_TRAIN_SLEEP_MS=1500
            Environment=BOT_TRAIN_MAX_TURNS=500
            Environment=BOT_TRAIN_BALANCED_ONLY=true
            Environment=PATH=/home/dutch/flutter/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            ExecStartPre=/usr/bin/git config --global --add safe.directory /home/dutch/flutter
            ExecStart=/home/dutch/flutter/bin/cache/dart-sdk/bin/dart run tool/bot_training_runner.dart
            Restart=always
            RestartSec=120
            Nice=10
            IOSchedulingClass=idle
            CPUQuota=45%
            OOMScoreAdjust=500

            [Install]
            WantedBy=multi-user.target
            SERVICE

            systemctl daemon-reload
            if systemctl restart dutch-bot-trainer; then
              systemctl enable dutch-bot-trainer
            else
              echo "⚠️ Trainer failed to start, keeping disabled"
              systemctl stop dutch-bot-trainer || true
              systemctl disable dutch-bot-trainer || true
            fi

            # ── Backend ──
            echo "🔨 Building backend..."
            cd /root/apps/dutch-server
            npm install --omit=dev 2>&1 || true
            npm install typescript @types/node @types/express @types/cors 2>&1 || true
            npm run build || { echo "❌ Build failed"; exit 1; }
            npm prune --production 2>&1 || true

            # ML data dirs
            mkdir -p data/bot-learning/{games,profiles,qlearning,neural,clones,personalities,tournaments,genetic,adaptive,leaderboard}
            mkdir -p data/player-learning/{profiles,history}
            chmod -R 755 data/

            # ── PM2 restart ──
            BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            # Write Firebase creds to file (avoids shell escaping issues with JSON)
            echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /root/apps/dutch-server/data/firebase-service-account.json
            chmod 600 /root/apps/dutch-server/data/firebase-service-account.json

            cat > ecosystem.config.cjs << 'PMCFG'
            const fs = require('fs');
            let firebaseCreds = '';
            try {
              firebaseCreds = fs.readFileSync('/root/apps/dutch-server/data/firebase-service-account.json', 'utf-8').trim();
            } catch(e) {}
            module.exports = {
              apps: [{
                name: 'dutch-server',
                cwd: '/root/apps/dutch-server',
                script: 'dist/index.js',
                instances: 1,
                exec_mode: 'fork',
                env: {
                  NODE_ENV: 'production',
                  PORT: 3000,
                  GIT_SHA: process.env.GIT_SHA || '',
                  BUILD_TIME: process.env.BUILD_TIME || '',
                  FIREBASE_SERVICE_ACCOUNT_JSON: firebaseCreds,
                },
                max_memory_restart: '700M',
              }],
            };
            PMCFG
            # Inject shell vars that the quoted heredoc can't expand
            export BUILD_TIME
            export GIT_SHA

            pm2 delete dutch-server 2>/dev/null || true
            pm2 start ecosystem.config.cjs
            pm2 save

            # Quick health check
            sleep 3
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "✅ Backend is healthy!"
            else
              echo "❌ Backend health check failed!"
              pm2 logs dutch-server --lines 20 --nostream
              exit 1
            fi

            echo "✅ Deploy complete"
