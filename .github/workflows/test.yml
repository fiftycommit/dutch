name: Tests

on:
  push:
  pull_request:
    branches: [main, develop]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Test PWA service worker generator
        run: node --test 'scripts/__tests__/**/*.test.mjs'

      # Suite Flutter complète. L'échec RL connu est tagué `known-failure` et
      # exclu explicitement (voir dart_test.yaml) : tout AUTRE échec fait échouer
      # le CI.
      - name: Flutter tests
        run: flutter test --exclude-tags known-failure

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dutch-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # `npm test` nettoie dist, recompile puis lance node --test (rendu
      # reproductible en 644fa65). Un échec de test fait échouer le CI.
      - name: Server tests
        run: npm test
