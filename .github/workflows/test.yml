name: Tests

on:
  push:
  pull_request:
    branches: [main, develop]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Test PWA service worker generator
        run: node --test 'scripts/__tests__/**/*.test.mjs'

      - name: Ensure no Flutter known-failure tests are active
        run: |
          if grep -R "known-failure" test integration_test --include='*.dart'; then
            echo "known-failure tags are reserved and must not be active in CI."
            exit 1
          fi

      - name: Flutter tests
        run: flutter test

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dutch-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # `npm test` nettoie dist, recompile puis lance node --test (rendu
      # reproductible en 644fa65). Un échec de test fait échouer le CI.
      - name: Server tests
        run: npm test

  server-redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: dutch-server
    env:
      REDIS_ENABLED: 'true'
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Redis-backed server tests
        run: npm run test:redis
