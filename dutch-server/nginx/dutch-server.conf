
# Configuration optimisée pour Socket.IO + Flutter Web SPA
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream dutch_backend {
    keepalive 64;
    server 127.0.0.1:3000;
}

server {
    server_name dutch-game.me www.dutch-game.me;

    # Racine pour le frontend Flutter (SPA)
    root /var/www/dutch/web;
    index index.html;

    # ── API ENDPOINTS (Proxy to Node.js) ──

    # 1. API prefix (Catch-all for /api/*)
    location /api/ {
        proxy_pass http://dutch_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Specific API/Page routes served by Node.js (not Flutter)
    location /admin {
        proxy_pass http://dutch_backend/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bot-stats {
        proxy_pass http://dutch_backend/bot-stats;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /player-profile {
        proxy_pass http://dutch_backend/player-profile;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /version {
        proxy_pass http://dutch_backend/version;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /status {
        proxy_pass http://dutch_backend/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rooms {
        proxy_pass http://dutch_backend/rooms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://dutch_backend/health;
        access_log off;
    }

    # 3. WebSocket (Socket.IO)
    location /socket.io/ {
        proxy_pass http://dutch_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # ── SEO Files (Bypass Flutter) ──
    location = /sitemap.xml {
        proxy_pass http://dutch_backend/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        root /var/www/dutch/web;
        default_type text/plain;
        try_files /robots.txt =404;
    }

    # ── Flutter SPA (Default Fallback) ──
    
    # No cache for main app files
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /main.dart.js {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /flutter.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets hashés (fonts, images, sons) = cache 1 an
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Canvaskit WASM = cache long
    location ~* /canvaskit/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Polices et images statiques
    location ~* \.(woff|woff2|ttf|eot|png|jpg|jpeg|gif|ico|svg|webp|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # JS/CSS racine (hors fichiers nommés ci-dessus)
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dutch-game.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dutch-game.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.dutch-game.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = dutch-game.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name dutch-game.me www.dutch-game.me;
    return 404; # managed by Certbot
}
