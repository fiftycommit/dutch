<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Admin - Dutch Game</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(circle at top, rgba(251,191,36,0.18), transparent 32%),
        linear-gradient(160deg, #0f172a 0%, #111827 45%, #0b1220 100%);
      color: #e2e8f0;
    }
    .shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .panel {
      width: min(920px, 100%);
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
      align-items: stretch;
    }
    .hero, .login-card {
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.35);
    }
    .hero {
      padding: 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(251,191,36,0.12);
      color: #fbbf24;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 {
      margin: 20px 0 14px;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.02;
    }
    .lead {
      margin: 0;
      color: #cbd5e1;
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 44ch;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 28px;
    }
    .meta-item {
      padding: 16px;
      border-radius: 18px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }
    .meta-label {
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .meta-value {
      margin-top: 8px;
      color: #f8fafc;
      font-size: 1rem;
      font-weight: 700;
    }
    .login-card {
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .login-card h2 {
      margin: 0 0 10px;
      color: #fbbf24;
      font-size: 1.35rem;
    }
    .login-card p {
      margin: 0;
      color: #94a3b8;
      line-height: 1.5;
    }
    #auth-gate {
      min-height: 280px;
    }
    #auth-gate > div {
      min-height: auto !important;
      padding: 24px 0;
    }
    #auth-gate > div > div {
      width: 100%;
      max-width: none !important;
      box-shadow: none !important;
      border: 1px solid rgba(148, 163, 184, 0.14);
      background: rgba(30, 41, 59, 0.56) !important;
    }
    @media (max-width: 860px) {
      .panel {
        grid-template-columns: 1fr;
      }
      .hero {
        padding: 28px;
      }
      .meta-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="panel" style="max-width:480px;">
      <section class="login-card">
        <h2>Dutch Admin</h2>
        <div id="auth-gate"></div>
        <div id="app-content" style="display:none"></div>
      </section>
    </div>
  </div>

  <script src="/admin-auth.js"></script>
  <script src="/admin-assets/admin-login.js"></script>
</body>
</html>
