<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centre d'entra&icirc;nement - Dutch Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 8px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .subtitle {
      text-align: center;
      opacity: 0.85;
      margin-bottom: 40px;
      font-size: 1.1em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(255,255,255,0.15);
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-4px); }
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .card-icon {
      font-size: 2em;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
    }
    .bronze .card-icon { background: rgba(205, 127, 50, 0.3); }
    .silver .card-icon { background: rgba(192, 192, 192, 0.3); }
    .gold .card-icon { background: rgba(255, 215, 0, 0.3); }
    .platinum .card-icon { background: rgba(229, 228, 226, 0.3); }
    .card-title { font-size: 1.4em; font-weight: 700; }
    .stats-list { list-style: none; }
    .stats-list li {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .stats-list li:last-child { border-bottom: none; }
    .stat-label { opacity: 0.8; }
    .stat-value { font-weight: 600; font-size: 1.05em; }
    .win-rate-bar {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      margin-top: 12px;
      overflow: hidden;
    }
    .win-rate-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.8s ease;
    }
    .bronze .win-rate-fill { background: #cd7f32; }
    .silver .win-rate-fill { background: #c0c0c0; }
    .gold .win-rate-fill { background: #ffd700; }
    .platinum .win-rate-fill { background: #e5e4e2; }
    .loading {
      text-align: center;
      padding: 60px;
      font-size: 1.3em;
      opacity: 0.7;
    }
    .error {
      text-align: center;
      padding: 40px;
      background: rgba(255, 100, 100, 0.2);
      border-radius: 12px;
      margin: 20px 0;
    }
    .reset-btn {
      display: block;
      margin: 30px auto;
      padding: 12px 32px;
      background: rgba(255, 100, 100, 0.3);
      color: white;
      border: 1px solid rgba(255, 100, 100, 0.5);
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.2s;
    }
    .reset-btn:hover { background: rgba(255, 100, 100, 0.5); }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
    }
    .back-link:hover { color: white; }
    .no-data {
      text-align: center;
      padding: 60px;
      opacity: 0.6;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Centre d'entra&icirc;nement</h1>
    <p class="subtitle">Performances des bots par niveau de difficult&eacute; &mdash; SBMM</p>

    <div id="content">
      <div class="loading">Chargement des statistiques...</div>
    </div>

    <button class="reset-btn" onclick="resetStats()">R&eacute;initialiser toutes les donn&eacute;es</button>
    <a href="/" class="back-link">&larr; Retour au serveur</a>
  </div>

  <script>
    const LEVEL_CONFIG = {
      bronze: { name: 'Bronze', icon: '🥉', order: 0 },
      silver: { name: 'Argent', icon: '🥈', order: 1 },
      gold:   { name: 'Or',     icon: '🥇', order: 2 },
      platinum: { name: 'Platine', icon: '💎', order: 3 },
    };

    async function loadStats() {
      try {
        const res = await fetch('/api/sbmm/bot-stats');
        if (!res.ok) throw new Error('Erreur ' + res.status);
        const stats = await res.json();
        renderStats(stats);
      } catch (err) {
        document.getElementById('content').innerHTML =
          '<div class="error">Impossible de charger les stats : ' + err.message + '</div>';
      }
    }

    function renderStats(stats) {
      const levels = ['bronze', 'silver', 'gold', 'platinum'];
      const hasData = levels.some(l => stats[l] && stats[l].gamesPlayed > 0);

      if (!hasData) {
        document.getElementById('content').innerHTML =
          '<div class="no-data">Aucune donn&eacute;e pour le moment.<br>Les stats appara&icirc;tront apr&egrave;s les premi&egrave;res parties en SBMM.</div>';
        return;
      }

      let html = '<div class="grid">';
      for (const level of levels) {
        const s = stats[level];
        const config = LEVEL_CONFIG[level];
        if (!s) continue;

        const winRate = s.gamesPlayed > 0 ? (s.winRateVsHumans * 100).toFixed(1) : '0.0';
        const avgScore = s.gamesPlayed > 0 ? s.avgScore.toFixed(1) : '-';
        const avgRank = s.gamesPlayed > 0 ? s.avgRank.toFixed(1) : '-';
        const dutchRate = s.dutchCallCount > 0 ? (s.dutchSuccessRate * 100).toFixed(0) : '-';

        html += `
          <div class="card ${level}">
            <div class="card-header">
              <div class="card-icon">${config.icon}</div>
              <div class="card-title">${config.name}</div>
            </div>
            <ul class="stats-list">
              <li>
                <span class="stat-label">Parties jou&eacute;es</span>
                <span class="stat-value">${s.gamesPlayed}</span>
              </li>
              <li>
                <span class="stat-label">Win rate vs humain</span>
                <span class="stat-value">${winRate}%</span>
              </li>
              <li>
                <span class="stat-label">Score moyen</span>
                <span class="stat-value">${avgScore}</span>
              </li>
              <li>
                <span class="stat-label">Rang moyen</span>
                <span class="stat-value">${avgRank}</span>
              </li>
              <li>
                <span class="stat-label">Dutch r&eacute;ussi</span>
                <span class="stat-value">${dutchRate}%</span>
              </li>
            </ul>
            <div class="win-rate-bar">
              <div class="win-rate-fill" style="width: ${winRate}%"></div>
            </div>
          </div>
        `;
      }
      html += '</div>';
      document.getElementById('content').innerHTML = html;
    }

    async function resetStats() {
      if (!confirm('Supprimer toutes les donn\u00e9es SBMM (profils joueurs + stats bots) ?')) return;
      try {
        const res = await fetch('/api/sbmm/reset', { method: 'POST' });
        const data = await res.json();
        alert('Reset effectu\u00e9 : ' + data.deletedProfiles + ' profil(s) supprim\u00e9(s)');
        loadStats();
      } catch (err) {
        alert('Erreur : ' + err.message);
      }
    }

    loadStats();
  </script>
</body>
</html>
