<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Learning Stats - Dutch Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 3em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .subtitle {
      text-align: center;
      opacity: 0.9;
      margin-bottom: 40px;
      font-size: 1.2em;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .stat-value {
      font-size: 2.5em;
      font-weight: bold;
      margin: 10px 0;
    }
    .stat-label {
      opacity: 0.8;
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .leaderboard {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      margin-bottom: 40px;
    }
    .leaderboard h2 {
      margin-bottom: 20px;
      font-size: 2em;
    }
    .bot-entry {
      background: rgba(255,255,255,0.05);
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid;
    }
    .bot-entry.rank-1 { border-color: #FFD700; }
    .bot-entry.rank-2 { border-color: #C0C0C0; }
    .bot-entry.rank-3 { border-color: #CD7F32; }
    .bot-entry.rank-other { border-color: rgba(255,255,255,0.3); }
    .bot-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .bot-rank {
      font-size: 1.5em;
      font-weight: bold;
      min-width: 40px;
    }
    .bot-details {
      display: flex;
      flex-direction: column;
    }
    .bot-name {
      font-weight: bold;
      font-size: 1.1em;
    }
    .bot-meta {
      opacity: 0.7;
      font-size: 0.9em;
    }
    .bot-stats {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .bot-stat {
      text-align: center;
    }
    .bot-stat-value {
      font-weight: bold;
      font-size: 1.2em;
    }
    .bot-stat-label {
      opacity: 0.7;
      font-size: 0.8em;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85em;
      font-weight: bold;
      margin-left: 10px;
    }
    .badge.bronze { background: #CD7F32; }
    .badge.silver { background: #C0C0C0; color: #333; }
    .badge.gold { background: #FFD700; color: #333; }
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.2em;
    }
    .refresh-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(255,255,255,0.2);
      border: 2px solid white;
      color: white;
      padding: 15px 30px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1em;
      font-weight: bold;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }
    .refresh-btn:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 Bot Learning Dashboard</h1>
    <p class="subtitle">Statistiques d'apprentissage automatique des bots</p>
    
    <div id="loading" class="loading">Chargement des données...</div>
    
    <div id="content" style="display: none;">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Parties</div>
          <div class="stat-value" id="totalGames">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Bots Actifs</div>
          <div class="stat-value" id="totalBots">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Taux de Victoire Moyen</div>
          <div class="stat-value" id="avgWinRate">0%</div>
        </div>
      </div>

      <div class="leaderboard">
        <h2>🏆 Top Bots par MMR</h2>
        <div id="topBots"></div>
      </div>

      <div class="leaderboard">
        <h2>📊 Parties Récentes</h2>
        <div id="recentGames"></div>
      </div>
    </div>
  </div>

  <button class="refresh-btn" onclick="loadStats()">🔄 Rafraîchir</button>

  <script>
    async function loadStats() {
      try {
        const response = await fetch('/api/bot-learning/stats');
        const data = await response.json();
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        
        // Stats globales
        document.getElementById('totalGames').textContent = data.totalGames.toLocaleString();
        document.getElementById('totalBots').textContent = data.totalBots;
        document.getElementById('avgWinRate').textContent = (data.avgWinRate * 100).toFixed(1) + '%';
        
        // Top bots
        const topBotsHtml = data.topPerformers.map((bot, index) => {
          const rank = index + 1;
          const rankClass = rank <= 3 ? `rank-${rank}` : 'rank-other';
          const rankEmoji = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `#${rank}`;
          
          return `
            <div class="bot-entry ${rankClass}">
              <div class="bot-info">
                <div class="bot-rank">${rankEmoji}</div>
                <div class="bot-details">
                  <div class="bot-name">
                    ${bot.botId}
                    <span class="badge ${bot.skillLevel}">${bot.skillLevel}</span>
                  </div>
                  <div class="bot-meta">${bot.behavior} • ${bot.totalGames} parties</div>
                </div>
              </div>
              <div class="bot-stats">
                <div class="bot-stat">
                  <div class="bot-stat-value">${bot.mmr}</div>
                  <div class="bot-stat-label">MMR</div>
                </div>
                <div class="bot-stat">
                  <div class="bot-stat-value">${(bot.winRate * 100).toFixed(0)}%</div>
                  <div class="bot-stat-label">Victoires</div>
                </div>
                <div class="bot-stat">
                  <div class="bot-stat-value">${(((typeof bot.avgPBeatHuman === 'number' ? bot.avgPBeatHuman : 0.5)) * 100).toFixed(0)}%</div>
                  <div class="bot-stat-label">Vs humain</div>
                </div>
                <div class="bot-stat">
                  <div class="bot-stat-value">${bot.avgScore.toFixed(1)}</div>
                  <div class="bot-stat-label">Score Moy.</div>
                </div>
              </div>
            </div>
          `;
        }).join('');
        
        document.getElementById('topBots').innerHTML = topBotsHtml || '<p style="opacity: 0.7;">Aucun bot enregistré pour le moment</p>';
        
        // Parties récentes
        const recentGamesHtml = data.recentGames.slice(0, 5).map(game => {
          const date = new Date(game.startTime).toLocaleString('fr-FR');
          const duration = game.endTime ? 
            Math.round((new Date(game.endTime) - new Date(game.startTime)) / 1000) + 's' : 
            'En cours';
          
          return `
            <div class="bot-entry rank-other">
              <div class="bot-info">
                <div class="bot-details">
                  <div class="bot-name">${game.botName}</div>
                  <div class="bot-meta">${date} • ${game.gameMode} • ${game.numberOfPlayers} joueurs${typeof game.pBeatHuman === 'number' ? ` • Vs humain ${(game.pBeatHuman * 100).toFixed(0)}%` : ''}</div>
                </div>
              </div>
              <div class="bot-stats">
                <div class="bot-stat">
                  <div class="bot-stat-value">#${game.finalRank}</div>
                  <div class="bot-stat-label">Rang</div>
                </div>
                <div class="bot-stat">
                  <div class="bot-stat-value">${game.finalScore}</div>
                  <div class="bot-stat-label">Score</div>
                </div>
                <div class="bot-stat">
                  <div class="bot-stat-value">${duration}</div>
                  <div class="bot-stat-label">Durée</div>
                </div>
              </div>
            </div>
          `;
        }).join('');
        
        document.getElementById('recentGames').innerHTML = recentGamesHtml || '<p style="opacity: 0.7;">Aucune partie enregistrée pour le moment</p>';
        
      } catch (error) {
        console.error('Erreur chargement stats:', error);
        document.getElementById('loading').textContent = 'Erreur de chargement des données';
      }
    }
    
    // Charger au démarrage
    loadStats();
    
    // Auto-refresh toutes les 30 secondes
    setInterval(loadStats, 30000);
  </script>
</body>
</html>
