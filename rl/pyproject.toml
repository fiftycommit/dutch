[project]
name = "dutch-rl"
version = "0.1.0"
description = "Phase 2 RL Dutch'78 — wrapper Gymnasium + PPO masqué (MaskablePPO) piloté par le runner Dart headless via NDJSON"
readme = "README.md"
# torch (via stable-baselines3) n'a pas encore de wheels 3.13+ : on borne en haut.
requires-python = ">=3.11,<3.13"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.26",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "tensorboard>=2.20.0",
]

[tool.uv]
package = false
