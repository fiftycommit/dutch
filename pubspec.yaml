name: dutch_game
description: Dutch card game - A memory and strategy card game
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  
  # State management
  provider: ^6.1.1
  
  # Audio
  audioplayers: ^6.5.1
  
  # Utils
  auto_size_text: ^3.0.0
  flutter_svg: ^2.0.9
  vector_graphics: ^1.1.19
  shared_preferences: ^2.5.4
  path_provider: ^2.1.2
  share_plus: ^12.0.1
  file_selector: ^1.0.3

  # Auth
  flutter_secure_storage: ^10.0.0

  # Multijoueur
  socket_io_client: ^3.1.4
  http: ^1.6.0
  connectivity_plus: ^7.0.0

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  google_sign_in: ^7.2.0
  sign_in_button: ^4.0.1
  firebase_messaging: ^16.1.1
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6

  # Media
  image_picker: ^1.1.2
  record: ^6.2.0
  url_launcher: ^6.3.1

  # Routing
  go_router: ^17.0.1
  web: ^1.1.1
  google_fonts: ^8.0.2
  cryptography: ^2.9.0
  crypto: ^3.0.3
  wakelock_plus: ^1.4.0
  firebase_app_check: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7

# Configuration flutter_native_splash
# Fond vert sombre DUTCH pour éliminer le flash blanc au démarrage natif
flutter_native_splash:
  color: "#0d2818"
  color_dark: "#0d2818"
  android_12:
    color: "#0d2818"
    color_dark: "#0d2818"
  # Pas d'image — le SplashScreen Flutter prend le relais immédiatement
  # Le but est juste d'éliminer l'écran blanc natif
  fullscreen: true
  # Ne pas toucher au web (géré par index.html)
  web: false

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/cards/
    - assets/sounds/
    - assets/music/
