name: dutch_game
description: Dutch card game - A memory and strategy card game
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  
  # State management
  provider: ^6.1.1
  
  # Audio
  audioplayers: ^6.5.1
  
  # Utils
  flutter_svg: ^2.0.9
  vector_graphics: ^1.1.19
  shared_preferences: ^2.5.4
  path_provider: ^2.1.2
  share_plus: ^10.1.4
  file_selector: ^1.0.3

  # Multijoueur
  socket_io_client: ^3.1.4
  http: ^1.6.0
  connectivity_plus: ^6.1.4

  # Routing
  go_router: ^17.0.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/cards/
    - assets/sounds/
    - assets/music/
