<!DOCTYPE html>

  style="background: linear-gradient(to bottom, #0d2818, #1a472a); overscroll-behavior-x: none;">

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <!-- Google Sign-In (Web Client ID — Firebase Console → Auth → Google → Config SDK Web) -->

    content="751846261054-afco12nm8efkbngi43hp6rstp8ur2flj.apps.googleusercontent.com">
  <title>Dutch Game — Jeu de cartes en ligne multijoueur</title>
  <meta name="description"
    content="Dutch Game est un jeu de cartes stratégique jouable en ligne. Découvrez les règles, le gameplay et le mode multijoueur.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://dutch-game.me/">

  <!-- Open Graph -->
  <meta property="og:title" content="Dutch Game — Jeu de cartes en ligne multijoueur">
  <meta property="og:description" content="Dutch Game est un jeu de cartes stratégique jouable en ligne.">
  <meta property="og:url" content="https://dutch-game.me/">
  <meta property="og:type" content="website">

  <!-- PWA / UI -->
  <meta name="theme-color" content="#0d2818">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dutch Game">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #0d2818, #1a472a);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    flutter-view,
    flt-glass-pane,
    #flt-glass-pane,
    #flutter_target {
      background: transparent !important;
    }

    /* Native splash screen */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom, #0d2818, #1a472a);
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #splash-title {
      color: white;
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 8px;
      text-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
      margin-bottom: 8px;
    }

    #splash-subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }

    #splash-progress-container {
      width: 220px;
      height: 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      overflow: hidden;
    }

    #splash-progress {
      position: relative;
      height: 100%;
      width: 100%;
      border-radius: 5px;
      overflow: hidden;
    }

    #splash-progress::before {
      content: '';
      position: absolute;
      top: 0;
      left: -35%;
      width: 35%;
      height: 100%;
      border-radius: 5px;
      background: linear-gradient(90deg, rgba(139, 195, 74, 0.0), #8BC34A, rgba(139, 195, 74, 0.0));
    }

    #splash-progress.indeterminate::before {
      animation: indeterminateProgress 1.1s ease-in-out infinite;
      animation-direction: alternate;
    }

    @keyframes indeterminateProgress {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(400%);
      }
    }

    #splash-status {
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <!-- Native HTML splash (visible before Flutter loads) -->
  <!-- Cacher immédiatement si on a une session à restaurer (reload en jeu) -->
  <script>
    try {
      if (sessionStorage.getItem('dutch_room_code')) {
        document.write('<style>#splash{display:none!important}</style>');
      }
    } catch(_) {}
  </script>
  <div id="splash">
    <div id="splash-title">DUTCH</div>
    <div id="splash-subtitle">Jeu de Mémoire et Stratégie</div>
    <div id="splash-progress-container">
      <div id="splash-progress" class="indeterminate"></div>
    </div>
    <div id="splash-status">Chargement...</div>
  </div>

  <noscript>
    <h1>Dutch Game</h1>
    <p>Jeu de cartes stratégique jouable en ligne. Retrouvez les règles, le gameplay et le mode multijoueur sur
      dutch-game.me.</p>
  </noscript>

  <script>
    // Routes de jeu (fond vert) vs routes neutres (fond noir)
    var GAME_ROUTES = ['/game', '/memorization', '/results', '/dutch-reveal', '/setup'];

    function _isGameRoute(path) {
      for (var i = 0; i < GAME_ROUTES.length; i++) {
        if (path.indexOf(GAME_ROUTES[i]) !== -1) return true;
      }
      return false;
    }

    function _updateSafeBgFromRoute() {
      var path = window.location.pathname + window.location.hash;
      var isGame = _isGameRoute(path);
      var bg = isGame
        ? 'linear-gradient(to bottom, #0d2818, #1a472a)'
        : '#000000';
      document.documentElement.style.background = bg;
      document.body.style.background = bg;
    }

    _updateSafeBgFromRoute();
    window.addEventListener('popstate', _updateSafeBgFromRoute);
    var _origPushState = history.pushState.bind(history);
    history.pushState = function () {
      _origPushState.apply(history, arguments);
      _updateSafeBgFromRoute();
    };
    var _origReplaceState = history.replaceState.bind(history);
    history.replaceState = function () {
      _origReplaceState.apply(history, arguments);
      _updateSafeBgFromRoute();
    };

    window.setSafeBg = function (value) {
      document.documentElement.style.background = value;
      document.body.style.background = value;
      window._fixFlutterBg();
    };

    // Force Flutter view + Shadow DOM to transparent so body bg shows through
    window._fixFlutterBg = function () {
      var fv = document.querySelector('flutter-view');
      if (!fv) return;
      fv.style.background = 'transparent';
      if (fv.shadowRoot) {
        var glass = fv.shadowRoot.querySelector('flt-glass-pane');
        if (glass) glass.style.background = 'transparent';
        // Also target any host-level styles
        var style = document.createElement('style');
        style.textContent = ':host, flt-glass-pane { background: transparent !important; }';
        if (!fv.shadowRoot.querySelector('[data-safe-bg-fix]')) {
          style.setAttribute('data-safe-bg-fix', '');
          fv.shadowRoot.appendChild(style);
        }
      }
    };

    // Watch for Flutter view creation and fix background + re-enable zoom
    new MutationObserver(function (mutations) {
      if (document.querySelector('flutter-view')) {
        window._fixFlutterBg();
        // Re-enable browser zoom (Flutter overrides viewport meta)
        var vp = document.querySelector('meta[name="viewport"]');
        if (vp && vp.content.indexOf('user-scalable=no') !== -1) {
          vp.setAttribute('content', 'width=device-width, initial-scale=1.0');
        }
        // Allow pinch-zoom on Flutter's glass pane
        var fv = document.querySelector('flutter-view');
        if (fv && fv.shadowRoot) {
          var glass = fv.shadowRoot.querySelector('flt-glass-pane');
          if (glass) glass.style.touchAction = 'manipulation';
        }
      }
    }).observe(document.documentElement, { childList: true, subtree: true });

    // Allow Safari trackpad pinch-to-zoom (passive = don't block)
    document.addEventListener('gesturestart', function() {}, { passive: true });
    document.addEventListener('gesturechange', function() {}, { passive: true });
    document.addEventListener('gestureend', function() {}, { passive: true });

    window.splashProgress = 0;
    window.splashStatus = '';
    window.flutterTookOver = false;
    window._lastSplashLogAt = 0;

    window.SPLASH_LOW_BANDWIDTH_DOWNLINK_Mbps = 1.5;
    window.isLowBandwidth = function () {
      var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      if (!conn) return false;
      if (conn.saveData) return true;
      var type = conn.effectiveType || '';
      if (type === 'slow-2g' || type === '2g' || type === '3g') return true;
      var downlink = conn.downlink;
      if (typeof downlink === 'number' && downlink > 0 && downlink < window.SPLASH_LOW_BANDWIDTH_DOWNLINK_Mbps) {
        return true;
      }
      return false;
    };

    window.updateSplash = function (progress, status) {
      if (progress < window.splashProgress) return;

      window.splashProgress = progress;
      window.splashStatus = status ?? '';

      var statusEl = document.getElementById('splash-status');
      if (statusEl && status) statusEl.textContent = status;

    };

    window.hideSplash = function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 300);
      }
    };

    window.flutterReady = function () {
      window.flutterTookOver = true;
      try { sessionStorage.removeItem('dutch_bootstrap_retries'); } catch (_) { }
    };

    // Watchdog anti "splash infini" (PWA iOS / Safari):
    // Si Flutter ne prend jamais la main, on force un reload avec cache-busting
    // jusqu'à 3 tentatives, puis action manuelle.
    setTimeout(function () {
      if (window.flutterTookOver) return;

      var retryCount = 0;
      try {
        retryCount = parseInt(sessionStorage.getItem('dutch_bootstrap_retries') || '0', 10);
      } catch (_) { }

      if (retryCount < 3) {
        try {
          sessionStorage.setItem('dutch_bootstrap_retries', String(retryCount + 1));
        } catch (_) { }
        // Cache-busting reload: force fresh fetch
        window.location.href = '/?cb=' + Date.now();
        return;
      }

      // After 3 retries, show manual action
      try { sessionStorage.removeItem('dutch_bootstrap_retries'); } catch (_) { }

      var statusEl = document.getElementById('splash-status');
      if (statusEl) statusEl.textContent = 'Chargement bloqué. Touchez pour relancer.';

      var splash = document.getElementById('splash');
      if (splash) {
        splash.style.cursor = 'pointer';
        splash.onclick = function () {
          try { sessionStorage.removeItem('dutch_bootstrap_retries'); } catch (_) { }
          window.location.href = '/?cb=' + Date.now();
        };
      }
    }, 20000);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register(
          '/firebase-messaging-sw.js',
          { scope: '/firebase-cloud-messaging-push-scope' }
        );
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v={{flutter_service_worker_version}}" async></script>
</body>

</html>
